<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>KAZOTH // OFFICIAL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="analog-noise"></div>
    <div class="fog-container">
        <div class="fog-layer layer-1"></div>
        <div class="fog-layer layer-2"></div>
    </div>
    <div class="vignette"></div>

    <main class="core-mainframe">
        
        <header class="hero-monolith">
            <div class="banner-wrap">
                <img src="kAzOth_BAN_219.png" alt="KAZOTH" class="apex-banner">
                <div class="banner-overlay"></div>
            </div>
        </header>

        <section class="streaming-hub reveal">
            <div class="hub-container">
                <a href="https://open.spotify.com/artist/1duEVDXWzYXobiWeXz7AUZ" target="_blank" class="stream-card spotify">
                    <div class="stream-icon"><i class="fab fa-spotify"></i></div>
                    <div class="stream-info">
                        <span class="stream-brand">SPOTIFY</span>
                        <span class="stream-status">OFFICIAL ARTIST</span>
                    </div>
                    <div class="stream-action">OUVRIR</div>
                </a>

                <a href="https://link.deezer.com/s/33fFkfbkh44nQaIJwXBVc" target="_blank" class="stream-card deezer">
                    <div class="stream-icon"><i class="fab fa-deezer"></i></div>
                    <div class="stream-info">
                        <span class="stream-brand">DEEZER</span>
                        <span class="stream-status">STREAM NOW</span>
                    </div>
                    <div class="stream-action">OUVRIR</div>
                </a>

                <a href="https://music.apple.com/fr/artist/kazoth/1894281134" target="_blank" class="stream-card apple">
                    <div class="stream-icon"><i class="fab fa-apple"></i></div>
                    <div class="stream-info">
                        <span class="stream-brand">APPLE MUSIC</span>
                        <span class="stream-status">LISTEN HERE</span>
                    </div>
                    <div class="stream-action">OUVRIR</div>
                </a>
            </div>
        </section>

        <section class="hardware-module reveal">
            <div class="ornament top-left"></div>
            <div class="ornament top-right"></div>
            
            <div class="module-header">
                <span class="industrial-tag">SOUNDS</span>
                <span class="module-title">LATEST MIXES</span>
            </div>
            
            <div class="deck-chassis">
                <iframe width="100%" height="450" src="https://hearthis.at/kazoth/embed/?hcolor=ffffff&skin=black&playlist=1" frameborder="0" allowtransparency="true"></iframe>
            </div>
        </section>
        
        <section class="hardware-module reveal">
            <div class="ornament top-left"></div>
            <div class="ornament top-right"></div>
            
            <div class="module-header">
                <span class="industrial-tag">CONNECT</span>
                <span class="module-title">SOCIAL LINKS</span>
            </div>
            
            <nav class="matrix-grid">
                <a href="https://linktw.in/bQEHiM" target="_blank" class="cyber-node youtube">
                    <span class="node-corner"></span>
                    <i class="fab fa-youtube"></i>
                    <span class="node-label">YOUTUBE</span>
                </a>
                <a href="https://www.facebook.com/kAzOth.aka.Psykomars" target="_blank" class="cyber-node facebook">
                    <span class="node-corner"></span>
                    <i class="fab fa-facebook-f"></i>
                    <span class="node-label">FACEBOOK</span>
                </a>
                <a href="https://audio.com/kazoth" target="_blank" class="cyber-node audiocom">
                    <span class="node-corner"></span>
                    <i class="fas fa-music"></i>
                    <span class="node-label">AUDIO.COM</span>
                </a>
                <a href="https://hearthis.at/kazoth" target="_blank" class="cyber-node hearthis">
                    <span class="node-corner"></span>
                    <i class="fas fa-headphones"></i>
                    <span class="node-label">HEARTHIS</span>
                </a>
                <a href="https://www.mixcloud.com/Psykomars" target="_blank" class="cyber-node mixcloud">
                    <span class="node-corner"></span>
                    <i class="fab fa-mixcloud"></i>
                    <span class="node-label">MIXCLOUD</span>
                </a>
                <a href="https://soundcloud.com/the_kazoth" target="_blank" class="cyber-node soundcloud">
                    <span class="node-corner"></span>
                    <i class="fab fa-soundcloud"></i>
                    <span class="node-label">SOUNDCLOUD</span>
                </a>
                <a href="https://kazoth.bandcamp.com" target="_blank" class="cyber-node bandcamp">
                    <span class="node-corner"></span>
                    <i class="fab fa-bandcamp"></i>
                    <span class="node-label">BANDCAMP</span>
                </a>
                <a href="https://www.tiktok.com/@the.kazoth" target="_blank" class="cyber-node tiktok">
                    <span class="node-corner"></span>
                    <i class="fab fa-tiktok"></i>
                    <span class="node-label">TIKTOK</span>
                </a>
                <a href="https://www.instagram.com/the_kazoth" target="_blank" class="cyber-node instagram">
                    <span class="node-corner"></span>
                    <i class="fab fa-instagram"></i>
                    <span class="node-label">INSTAGRAM</span>
                </a>
            </nav>
        </section>

        <footer class="footer-monolith reveal">
            <a href="mailto:the.kAzOth@gmail.com" class="override-button">
                <span class="prime-data">THE.KAZOTH@GMAIL.COM</span>
                <span class="sub-data">CONTACT & BOOKING</span>
            </a>
            <div class="footer-details">
                <div class="line"></div>
                <p>KAZOTH — © 2026</p>
                <div class="line"></div>
            </div>
        </footer>

    </main>

</body>
</html>
